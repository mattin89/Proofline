services:
  - type: web
    name: proofline
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: pnpm install --frozen-lockfile
    startCommand: pnpm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: PROOFLINE_PUBLIC_DEMO
        value: "true"
      - key: PROOFLINE_PUBLIC_DEMO_MAX_RESEARCH_UNITS
        value: "200"
      - key: TAVILY_API
        sync: false
      - key: EXA_API
        sync: false
      - key: GITHUB_TOKEN
        sync: false
